name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r docs-requirements.txt
      - run: python -m pip install -e ".[dev]"

      # mkdocs.yml sets strict: true, so a broken internal link or a nav entry
      # pointing at a page that does not exist fails here rather than shipping
      # a site with a dead link in it.
      - name: mkdocs build
        run: python -m mkdocs build --site-dir _site

      # The pages are generated from the READMEs and from the code. Building
      # a stale docs/ would succeed and publish a site that describes an
      # earlier version of the contract, which is the exact failure the site
      # is meant not to have.
      - name: the generated pages are current
        run: python3 tools/build_docs.py --check

      # The docs tests skip themselves wherever mkdocs is not importable, and
      # the tests jobs do not install it, so before this step the sitemap
      # check had never run anywhere: it reported a skip in CI and a pass only
      # on a laptop that happened to have mkdocs. This is the one job that
      # has it.
      - name: the docs tests, where mkdocs actually exists
        run: python -m pytest tests/test_docs_site.py -q

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: deploy to Pages
    # Only from main. A pull request builds the site, to catch a broken link
    # before it lands, and publishes nothing.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
