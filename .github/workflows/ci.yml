name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (py${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # The gates compare quoted text against files on disk, so path and
          # encoding behaviour is load-bearing. Both other platforms get a run.
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: pytest
        run: python -m pytest -q

      # Every test file must also run as a plain script, so a contributor with
      # no pytest installed can still check a gate. A file that only works
      # under pytest silently loses that, so it is verified here.
      - name: each test file as a standalone script
        shell: bash
        run: |
          status=0
          for f in tests/test_*.py; do
            echo "--- $f"
            python "$f" || status=1
          done
          exit $status

      # The installed console script, actually invoked.
      #
      # pyproject.toml declared `persona-to-skill = "persona_to_skill.cli:main"`
      # for eleven commits while persona_to_skill/cli.py did not exist. The
      # install above succeeded, 321 tests were green, and the command died
      # with ModuleNotFoundError on its first run. Nothing here ran it.
      #
      # tests/test_entry_points.py now resolves the declared target, which
      # catches an absent module. This step catches the rest: a console script
      # that the packaging metadata generates wrong, an import that only fails
      # outside the repo root, and an exit code that does not come back.
      - name: the installed command, invoked
        shell: bash
        run: |
          set -e
          cd "$(mktemp -d)"   # outside the repo: no sys.path luck
          persona-to-skill --help > /dev/null
          persona-to-skill fetch https://example.com/a > /dev/null
          echo '{}' > bundle.json
          mkdir corpus
          # An empty bundle must FAIL. A gate that exits 0 on nothing cannot be
          # put in a CI job, which is the same as not having one.
          if persona-to-skill gates bundle.json --corpus corpus > /dev/null; then
            echo "::error::gates exited 0 on an empty bundle"
            exit 1
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.6.9
      - run: python -m ruff check persona_to_skill tests
      - name: punctuation gate on the documentation
        run: python -m persona_to_skill.validate_punct

      - name: no non-ASCII in any path
        run: |
          if LC_ALL=C git ls-files | LC_ALL=C grep -nP '[^\x00-\x7F]'; then
            echo "::error::non-ASCII path; some skill uploaders reject the whole archive"
            exit 1
          fi
