# A gate that cannot fail is worse than no gate: it grants false confidence.
#
# This workflow runs only the checks that prove the four gates still bite, and
# it is separate from CI so the result is legible on its own. A fork may change
# anything here, but one that guts a gate while keeping the project's name goes
# red on its own pull requests, in public.
name: Gates intact

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teeth:
    name: every gate rejects a broken input
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: each gate must reject a deliberately broken input
        run: python tests/test_gates_have_teeth.py

      - name: frozen contract values unchanged
        run: python tests/test_contract_frozen.py

      - name: every gate module is present and callable
        run: |
          python - <<'PY'
          import sys
          from persona_to_skill.gates import anchor, consent, disclosure, holdout
          missing = [m.__name__ for m in (consent, anchor, disclosure, holdout)
                     if not callable(getattr(m, "check", None))]
          if missing:
              sys.exit("gate module(s) with no check(): " + ", ".join(missing))
          print("4 gates present")
          PY

      - name: no gate has lost its negative tests
        shell: bash
        run: |
          status=0
          for gate in consent anchor disclosure holdout; do
            n=$(grep -c 'assert not' "tests/test_gate_${gate}.py" || true)
            echo "${gate}: ${n} negative assertion(s)"
            if [ "${n}" -lt 4 ]; then
              echo "::error file=tests/test_gate_${gate}.py::fewer than 4 negative assertions; a gate without negative tests is unverified"
              status=1
            fi
          done
          exit $status
