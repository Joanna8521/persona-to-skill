[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persona-to-skill"
version = "0.1.0"
description = "Reconstruct a documented method as an agent skill, with receipts."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["agent-skills", "claude", "llm", "provenance", "citations"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
persona-to-skill = "persona_to_skill.cli:main"

[tool.setuptools.packages.find]
include = ["persona_to_skill*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
